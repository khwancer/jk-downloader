<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>JKAnime Notifier</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="header">
    <h1>JK Downloader</h1>
    <div class="header-actions">
      <button id="btn-theme-toggle" class="btn-icon" title="Cambiar tema">
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button id="btn-force-check" class="btn-primary" title="Buscar nuevos capítulos ahora">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        <span>Revisar</span>
      </button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab-indicator" id="tab-indicator"></div>
    <button class="tab-btn active" data-tab="tab-recent">Últimos Episodios</button>
    <button class="tab-btn" data-tab="tab-favorites">Mis Favoritos</button>
  </div>

  <div class="tab-content active" id="tab-recent">
    <div id="recent-list" class="anime-list">
      <div class="loading">Cargando...</div>
    </div>
  </div>

  <div class="tab-content" id="tab-favorites">
    <div id="favorites-list" class="anime-list">
      <div class="empty-msg">No tienes animes favoritos guardados.</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
