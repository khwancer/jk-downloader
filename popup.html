<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>JK Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body class="preload">
  <div class="header">
    <h1>JK Downloader</h1>
    <div class="header-actions">
      <button id="btn-theme-toggle" class="btn-icon" type="button" title="Cambiar tema">
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button id="btn-settings-toggle" class="btn-icon" type="button" title="Ajustes y respaldo">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button id="btn-force-check" class="btn-primary" type="button" title="Buscar nuevos capítulos ahora">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        <span>Revisar</span>
      </button>
    </div>
  </div>

  <div id="status-banner" class="status-banner" hidden></div>

  <div id="active-anime-bar" class="active-anime-bar" hidden>
    <div class="active-anime-text">
      <span class="active-anime-label">En esta pestaña:</span>
      <strong id="active-anime-name" class="active-anime-name"></strong>
    </div>
    <button id="btn-add-active-fav" class="btn-chip" type="button">+ Favorito</button>
  </div>

  <div id="settings-panel" class="settings-panel" hidden>
    <div class="setting-row">
      <label for="select-interval">Revisión automática</label>
      <select id="select-interval">
        <option value="15">Cada 15 min</option>
        <option value="30">Cada 30 min</option>
        <option value="60">Cada 1 hora</option>
        <option value="120">Cada 2 horas</option>
      </select>
    </div>
    <div class="setting-row">
      <label for="select-server">Servidor preferido</label>
      <select id="select-server">
        <option value="mediafire">MediaFire primero</option>
        <option value="mp4upload">Mp4Upload primero</option>
      </select>
    </div>
    <div class="setting-row">
      <label for="chk-notifications">Notificaciones de escritorio</label>
      <input type="checkbox" id="chk-notifications" checked>
    </div>
    <div class="setting-actions">
      <button id="btn-export-favs" class="btn-secondary" type="button">Exportar Favoritos</button>
      <button id="btn-import-favs" class="btn-secondary" type="button">Importar JSON</button>
      <input type="file" id="input-import-favs" accept="application/json,.json" hidden>
    </div>
  </div>

  <div class="search-bar">
    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search-input" placeholder="Filtrar episodios o favoritos..." autocomplete="off">
    <button id="btn-clear-search" class="btn-clear-search" type="button" title="Limpiar filtro" hidden>×</button>
  </div>

  <div class="tabs">
    <div class="tab-indicator" id="tab-indicator"></div>
    <button class="tab-btn active" type="button" data-tab="tab-recent">Últimos Episodios</button>
    <button class="tab-btn" type="button" data-tab="tab-favorites" id="tab-btn-favorites">Mis Favoritos</button>
  </div>

  <div class="tab-content active" id="tab-recent">
    <div id="recent-list" class="anime-list">
      <div class="loading">Cargando...</div>
    </div>
  </div>

  <div class="tab-content" id="tab-favorites">
    <div id="favorites-list" class="anime-list">
      <div class="empty-msg">No tienes animes favoritos guardados.</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
